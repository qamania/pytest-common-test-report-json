[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = [
    ".github", "tests", "build", "dist", ".venv",
    "pytest_json_ctrf.egg-info", ".env", ".gitignore",
    "CHANGELOG.md", "assets", "test-results", "schema_validator"]

[project]
name = "pytest-json-ctrf"
version = "0.6.5"

# minimum pytest and Python versions: keep in sync with .github/workflows/deploy.yml and the README
dependencies = [
    "pytest>=7.4",
]

authors = [
    { name = "Oleksii Ostapov" },
]
description = "Pytest plugin to generate json report in CTRF (Common Test Report Format)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
"QAMania" = "https://qamania.org"
"Homepage" = "https://github.com/infopulse/pytest-common-test-report-json"

[tool.pytest.ini_options]
markers = [
    "smoke: marker for smoke tests",
    "regression: marker for regression tests",
]

[project.entry-points.pytest11]
ctrf = "ctrf.main"

[dependency-groups]
dev = [
    "freezegun>=1.5",
    "jsonschema>=4.23.0",
    "pytest-rerunfailures>=14.0",
    "pytest-xdist>=3.6.1",
    "time-machine>=2.10",
]
