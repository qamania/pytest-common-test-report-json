name: build-and-publish

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: DEV
    permissions:
      id-token: write
    env:
      REPORT: 'test-results/report.json'
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        # the project and its dev group exactly as in uv.lock; fails if the lock is out of date
        run: uv sync --locked
      - name: Lint with flake8
        run: |
          uvx flake8 ctrf --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Download CTRF schema
        run: |
          curl -fsSLO https://raw.githubusercontent.com/ctrf-io/ctrf/main/schema/ctrf.schema.json
      - name: Run tests
        run: |
          uv run pytest --ctrf $REPORT tests/test_plugin.py tests/test_validate.py
        env:
          CTRF_SCHEMA: ctrf.schema.json
      - name: Validate report against CTRF schema
        run: |
          uv run python schema_validator/validate.py --schema ctrf.schema.json --report $REPORT
      - name: Build package
        run: |
          uv build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Generate Pretty Report
        if: always()
        uses: ctrf-io/github-test-reporter@v1.3.0
        with:
          report-path: ${{ env.REPORT }}
          github-report: true